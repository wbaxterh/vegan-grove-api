version: 2
# Patch and minor bumps arrive grouped once a week. Major versions are left to
# deliberate upgrades: Next majors track what Amplify supports, Expo packages
# track the SDK, and TypeScript majors change the compiler. Security alerts
# still appear in the Security tab regardless of these ignores.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
